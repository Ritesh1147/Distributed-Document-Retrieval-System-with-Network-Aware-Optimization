      NODE_ID: dist-s0r0
      CLUSTER: distributed
      SHARD_ID: "0"
      NUM_SHARDS: "4"
      ZONE: zone0
      ADVERTISE_URL: http://dist-s0r0:8000
      NET_PROFILE: datacenter
    healthcheck:
