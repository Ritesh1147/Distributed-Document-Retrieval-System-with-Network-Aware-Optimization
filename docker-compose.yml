    context: .
    dockerfile: docker/Dockerfile
  image: ddr:latest
  restart: unless-stopped
  cap_add: [NET_ADMIN]   # allows kernel netem via docker/netem.sh
  depends_on:
    redis:
      condition: service_healthy

x-ddr-env: &ddr-env
  REDIS_URL: redis://redis:6379/0

services:
